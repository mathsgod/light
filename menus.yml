- label: System
  icon: sym_o_settings
  children:
    - label: User
      icon: sym_o_person
      children:
        - label: List
          icon: sym_o_list
          to: /User
          permission: user.index
        
        - label: Add
          icon: sym_o_add
          to: /User/add
          permission: user.add
            
    
    - label: Role
      icon: sym_o_group
      children:
        - label: List
          icon: sym_o_list
          to: /Role
          permission: role.index
          
        - label: Add
          icon: sym_o_add
          to: /Role/add
          permission: role.add


    - label: Permission
      icon: sym_o_lock
      to: /Permission
      permission: permission.index
      children:
        - label: List
          icon: sym_o_list
          to: /Permission
          permission: permission.index
          
        - label: All
          icon: sym_o_add
          to: /Permission/all
          permission: permission.all

        - label: Add
          icon: sym_o_add
          to: /Permission/add
          permission: permission.add
        
        - label: Export
          icon: sym_o_download
          to: /Permission/export
          permission: permission.export

    - label: Translate
      icon: sym_o_translate
      to: /Translate
      permission: translate.index
          
    - label: System
      icon: sym_o_settings
      children:
        - label: Menu
          icon: sym_o_menu
          to: /System/menu
          permission: system.menu.index

    
        - label: Server
          icon: sym_o_dns
          to: /System
          permission: system.index

        - label: Setting
          icon: sym_o_settings
          to: /System/setting
          permission: system.setting

        - label: Mail test
          icon: sym_o_mail
          to: /System/mailtest
          permission: system.mailtest
        
        - label: PHPInfo
          icon: sym_o_php
          to: /System/phpinfo
          permission: system.phpinfo

        - label: Package
          icon: sym_o_package
          to: /System/package
          permission: system.package

        - label: Database
          icon: sym_o_database
          children:
            - label: Table
              icon: sym_o_table
              to: /System/database/table
              permission: system.database.table

            - label: Backup
              icon: sym_o_cloud_download
              to: /System/database/backup
              permission: system.database.backup

            - label: Restore
              icon: sym_o_cloud_upload
              to: /System/database/restore
              permission: system.database.restore

            - label: Event
              icon: sym_o_event
              to: /System/database/event
              permission: system.database.event

            - label: Process
              icon: sym_o_memory
              to: /System/database/process
              permission: system.database.process
            
            - label: Check & Fix
              icon: sym_o_check_circle
              to: /System/database/check
              permission: system.database.check
              
            - label: Migrate
              icon: sym_o_table_convert
              to: /System/database/migrate
              permission: system.database.migrate
          
    - label: User log
      icon: sym_o_description
      to: /UserLog
      permission: user_log.index

    - label: Mail log
      icon: sym_o_description
      to: /MailLog
      permission: mail_log.index

    - label: Event log
      icon: sym_o_description
      to: /EventLog
      permission: event_log.index

    - label: System Value
      icon: sym_o_description
      children:
        - label: List
          icon: sym_o_list
          to: /SystemValue
          permission: system_value.index
        
        - label: Add
          icon: sym_o_add
          to: /SystemValue/add
          permission: system_value.add

    - label: File system
      icon: sym_o_folder
      to: /System/fs
      permission: system.fs

    - label: Custom Field
      icon: sym_o_deployed_code
      to: /CustomField
      permission: custom_field.index
